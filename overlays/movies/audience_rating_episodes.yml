external_templates:
  default: templates

templates:
  audience_score:
    default:
      horizontal_offset: 60
      horizontal_align: left
      vertical_offset: 60
      vertical_align: top
    conditionals:
      files:
        conditions:
          - key: audience_score_high_backdrop
            value: config/overlays/images/audience_score/audience_score_high.png
          - key: audience_score_mid_backdrop
            value: config/overlays/images/audience_score/audience_score_mid.png
          - key: audience_score_low_backdrop
            value: config/overlays/images/audience_score/audience_score_low.png
      user_rating.gte:
        conditions:
          - key: [audience_score_high, audience_score_high_backdrop]
            value: 8.0
          - key: [audience_score_mid, audience_score_mid_backdrop]
            value: 6.0
          - key: [audience_score_low, audience_score_low_backdrop]
            value: 0
      names:
        default: <<overlay_name>>
        conditions:
          - key: [audience_score_high, audience_score_mid, audience_score_low]
            value: text(<<user_rating>>)
    optional:
      - file
      - builder_level
    plex_all: true
    filters:
      user_rating.gte: <<user_rating.gte>>
    builder_level: <<builder_level>>
    overlay:  
      name: <<names>>
      group: <<group>>
      weight: <<weight>>
      file: <<files>>
      horizontal_offset: <<horizontal_offset>>
      horizontal_align: <<horizontal_align>>
      vertical_offset: <<vertical_offset>>
      vertical_align: <<vertical_align>>
      back_width: 140
      back_height: 80
      back_align: center
      font_color: "#000000"
      stroke_color: "#e8e3e3"
      stroke_width: "1"
      font: config/overlays/fonts/AvenirNextLTPro-Bold.ttf
      font_size: 78

overlays:
  # --- Episodes (Backdrop) ---
  episode_audience_score_high_backdrop:
    variables: { key: audience_score_high_backdrop, weight: 500, group: backdrop, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
  episode_audience_score_mid_backdrop:
    variables: { key: audience_score_mid_backdrop, weight: 400, group: backdrop, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
  episode_audience_score_low_backdrop:
    variables: { key: audience_score_low_backdrop, weight: 300, group: backdrop, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
    
  # --- Episodes (Score) ---
  episode_audience_score_high:
    variables: { key: audience_score_high, weight: 500, group: score, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
  episode_audience_score_mid:
    variables: { key: audience_score_mid, weight: 400, group: score, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
  episode_audience_score_low:
    variables: { key: audience_score_low, weight: 300, group: score, builder_level: episode, font_size: 120 }
    template: [ name: audience_score ]
