#####################################################
#                 HOLIDAYS 8.0                      #
#####################################################

templates:
  Holiday:
    sort_title: zzzzzzzzzz_<<collection_name>>
    smart_label: release.desc
    sync_mode: sync
    visible_home: false

# Holiday collections that will show up when the holiday has started and disappear when it has ended
collections:
  Christmas :
    template: { name: Holiday }
    visible_home: range(12/01-12/26)
    visible_shared: range(12/01-12/26)
    summary: Ho ho ho.
    file_poster: config/posters/Christmas.png
    trakt_list:
      - https://trakt.tv/users/ad76/lists/hallmark-christmas?sort=released,asc
      - https://trakt.tv/users/k0meta/lists/christmas-extravaganza-non-tv-movie
      - https://trakt.tv/users/movistapp/lists/christmas-movies
      - https://trakt.tv/users/questdvd/lists/absolute-hayes-christmas-classics
      - https://trakt.tv/users/patrickjmcd/lists/christmas?sort=rank,asc
      - https://trakt.tv/users/biggsandroid/lists/christmas?sort=title,asc
      - https://trakt.tv/users/ednagrinch/lists/christmas?sort=rank,asc
      - https://trakt.tv/users/vmsanta/lists/christmas?sort=rank,asc

